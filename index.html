<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111419" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Isoloir, outil indépendant : dites si vous êtes d’accord avec des idées présentées sans nom, et découvrez de quels candidats vous êtes proche. Vos réponses restent sur votre appareil." />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Aperçu des liens partagés (WhatsApp, Signal, iMessage…) : adresses absolues, lues par les applications, jamais chargées par la page.
         {{…}} : textes de l’élection par défaut, posés par Vite (vite.config.ts, shareMeta) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Isoloir" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://isoloir.vercel.app/" />
    <meta property="og:title" content="Isoloir : pointez les idées qui vous ressemblent" />
    <meta property="og:description" content="{{shareDescription}}" />
    <meta property="og:image" content="https://isoloir.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{shareImageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Isoloir : pointez les idées qui vous ressemblent" />
    <meta name="twitter:description" content="{{shareDescription}}" />
    <meta name="twitter:image" content="https://isoloir.vercel.app/og.png" />
    <meta name="twitter:image:alt" content="{{shareImageAlt}}" />
    <title>Isoloir</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Isoloir fonctionne entièrement dans votre navigateur et a besoin de JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
